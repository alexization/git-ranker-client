name: "✨ Frontend Feature Request"
description: 새 UI, 사용자 플로우, 인터랙션, 프론트엔드 QA 개선을 제안합니다.
title: "[Feature] "
labels: ["enhancement", "feature"]
body:
  - type: markdown
    attributes:
      value: |
        프론트엔드 기능 요청은 "컴포넌트 추가"보다 "사용자 경험이 어떻게 달라지는지"가 먼저입니다.

  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      placeholder: 사용자가 현재 랭킹 변화 이유를 이해하기 어려워 이탈이 발생합니다.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 원하는 사용자 결과
      placeholder: 사용자가 랭킹 상세 화면에서 점수 증감 원인을 바로 이해할 수 있어야 합니다.
    validations:
      required: true

  - type: input
    id: route
    attributes:
      label: 대상 화면 또는 라우트
      placeholder: "/ranking, /users/[username]"
    validations:
      required: true

  - type: textarea
    id: desired_behavior
    attributes:
      label: 원하는 UI / 인터랙션
      placeholder: |
        - 사용자가 어떤 행동을 하는지
        - 어떤 상태가 보여야 하는지
        - 실패/빈 상태는 어떻게 보여야 하는지
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 수용 기준
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: contract_dependency
    attributes:
      label: 백엔드 / API 의존성
      placeholder: |
        - 필요한 API:
        - 계약 변경 여부:
        - 연관 backend 이슈/PR:
    validations:
      required: false

  - type: textarea
    id: qa_evidence
    attributes:
      label: 필요한 QA 증거
      placeholder: |
        - 스크린샷:
        - Playwright:
        - 브라우저 콘솔/네트워크 확인:
        - 반응형 확인:
    validations:
      required: true

  - type: textarea
    id: non_goals_and_risks
    attributes:
      label: 비목표와 리스크
      placeholder: |
        비목표:
        리스크:
    validations:
      required: false

