name: "🛠️ Frontend Engineering Task"
description: 리팩터링, 성능, 접근성, 테스트 하니스, DX 개선 작업을 기록합니다.
title: "[Task] "
labels: ["task", "triage"]
body:
  - type: dropdown
    id: task_type
    attributes:
      label: 작업 유형
      options:
        - ui-refactor
        - performance
        - accessibility
        - testing
        - developer-experience
        - dependency-upgrade
        - documentation
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 왜 필요한가요?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      placeholder: |
        - route:
        - component:
        - hook/store:
        - test/harness:
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: 검증 방법
      placeholder: |
        - `npm run lint`
        - `npm run build`
        - 스크린샷 / 브라우저 QA / Playwright
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: 리스크 및 의존성
      placeholder: |
        - 리스크:
        - 백엔드 의존성:
        - 후속 작업:
    validations:
      required: false

